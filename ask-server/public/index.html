<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공통 자산 탐색기</title>
<style>
  :root{
    --bg:#F4F6F5; --panel:#FFFFFF; --edge:#CBD8D5; --ink:#20303D; --soft:#5C6B73;
    --fe:#C97A1F; --be:#3F6FB0; --accent:#1F8A5F;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141C22; --panel:#1D2830; --edge:#31424C; --ink:#EAF1F0; --soft:#9FB2B9; --fe:#E7A759; --be:#7FA8DE; --accent:#5FC498; }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',sans-serif;
    display:flex;flex-direction:column;height:100vh;}
  .ask-bar{
    display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--edge);
    flex-shrink:0;align-items:center;
  }
  .ask-bar input{
    flex:1;padding:8px 12px;border:1px solid var(--edge);border-radius:8px;background:var(--bg);
    color:var(--ink);font-size:13.5px;
  }
  .ask-bar input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .ask-bar button{
    padding:8px 16px;border:none;border-radius:8px;background:var(--accent);color:#fff;
    font-size:13.5px;font-weight:600;cursor:pointer;flex-shrink:0;
  }
  .ask-bar button:disabled{opacity:.6;cursor:default;}
  .ask-answer{
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--edge);font-size:13.5px;
    line-height:1.65;flex-shrink:0;max-height:180px;overflow-y:auto;
  }
  .ask-answer.loading{color:var(--soft);}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--edge);border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;}
  .ask-bar button .spinner{border-color:rgba(255,255,255,.4);border-top-color:#fff;margin-right:6px;}
  .skeleton{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
  .skeleton span{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--edge) 25%,var(--bg) 50%,var(--edge) 75%);
    background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;}
  .skeleton span:nth-child(1){width:92%;} .skeleton span:nth-child(2){width:78%;} .skeleton span:nth-child(3){width:55%;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}
  @media (prefers-reduced-motion: reduce){ .spinner,.skeleton span{animation-duration:3s;} }
  .ask-answer.error{color:#B34B2E;}
  .ask-answer .q{font-weight:700;margin-bottom:6px;}
  .main{display:flex;flex:1;min-height:0;}
  .panel{width:300px;border-right:1px solid var(--edge);background:var(--panel);display:flex;flex-direction:column;flex-shrink:0;}
  .panel-title{padding:12px 14px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--soft);
    text-transform:uppercase;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;align-items:center;}
  .refresh-btn{background:none;border:1px solid var(--edge);border-radius:6px;padding:2px 8px;font-size:10px;
    color:var(--soft);cursor:pointer;text-transform:none;letter-spacing:0;}
  .tree{overflow-y:auto;flex:1;padding:6px 0;}
  .group-head{padding:8px 14px 4px;font-size:11px;font-weight:700;color:var(--soft);display:flex;gap:6px;align-items:center;}
  .group-head .count{background:var(--edge);border-radius:999px;padding:0 6px;font-size:10px;}
  .asset-list{list-style:none;margin:0;padding:0;}
  .asset{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 24px;cursor:pointer;font-size:13px;}
  .asset:hover{background:var(--bg);}
  .asset.active{background:var(--edge);}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.frontend-component{background:var(--fe);}
  .dot.backend-module{background:var(--be);}
  .dot.frontend-feature{border:2px solid var(--fe);}
  .dot.backend-feature{border:2px solid var(--be);}
  .name{font-weight:600;flex-shrink:0;}
  .purpose{color:var(--soft);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .detail{flex:1;padding:28px 32px;overflow-y:auto;}
  .detail h1{font-size:20px;margin:0 0 4px;}
  .detail .path{font-family:monospace;font-size:12.5px;color:var(--soft);margin-bottom:18px;}
  .detail .purpose-full{font-size:14.5px;line-height:1.7;margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field .label{font-size:11px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:4px 10px;font-family:monospace;font-size:12px;}
  .meta{font-size:12.5px;color:var(--soft);}
  .empty{padding:40px;color:var(--soft);text-align:center;}
  .code-block{
    background:var(--panel);border:1px solid var(--edge);border-radius:8px;
    padding:14px 16px;overflow-x:auto;font-family:'Consolas','Menlo',monospace;
    font-size:12.5px;line-height:1.6;white-space:pre;
  }
  .sig-list{display:flex;flex-direction:column;gap:4px;}
  .sig{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:5px 10px;
    font-family:'Consolas','Menlo',monospace;font-size:12px;overflow-x:auto;white-space:nowrap;}
  .chip.link{cursor:pointer;}
  .chip.link:hover{border-color:var(--accent);color:var(--accent);}
  .doc{background:var(--panel);border:1px solid var(--edge);border-radius:10px;overflow:hidden;margin-bottom:20px;}
  .doc-sec{padding:14px 18px;border-top:1px solid var(--edge);}
  .doc-sec:first-child{border-top:none;}
  .doc-sec h3{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--soft);letter-spacing:.03em;}
  .doc-sec.warn{background:color-mix(in srgb, #D9A21B 10%, var(--panel));}
  .doc-sec.warn h3{color:#B07A00;}
  .doc-sec ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.75;}
  .doc-sec p{margin:0;font-size:13.5px;line-height:1.75;}
  .doc-sec .code-block{background:var(--bg);margin:0;}
  .kv{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:6px 16px;font-size:13.5px;line-height:1.65;}
  .kv .k{font-family:'Consolas','Menlo',monospace;font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap;}
  @media (prefers-color-scheme: dark){ .doc-sec.warn h3{color:#E7C35A;} }
  .history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .history li{display:grid;grid-template-columns:max-content max-content 1fr;gap:10px;align-items:baseline;
    background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:6px 10px;font-size:13px;}
  .history .when{font-family:'Consolas','Menlo',monospace;font-size:12px;color:var(--soft);white-space:nowrap;}
  .grade{border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap;color:#fff;}
  .grade.breaking{background:#C0392B;} .grade.behavior{background:#B07A00;}
  .grade.compatible{background:#1F8A5F;} .grade.new{background:#5C6B73;} .grade.docs{background:var(--edge);color:var(--ink);}
</style>
</head>
<body>
  <div class="ask-bar">
    <input id="ask-input" type="text" placeholder="예: 파일 업로드 처리하는 컴포넌트 있어? (Enter로 질문)" />
    <button id="ask-btn">검색</button>
  </div>
  <div class="ask-answer" id="ask-answer" hidden></div>

  <div class="main">
    <div class="panel">
      <div class="panel-title">
        공통 자산 탐색기
        <button class="refresh-btn" id="refresh-btn">새로고침</button>
      </div>
      <div class="tree" id="tree"><div class="empty">불러오는 중...</div></div>
    </div>
    <div class="detail" id="detail">
      <div class="empty">왼쪽에서 항목을 클릭하면 상세 정보가 여기 표시됩니다.</div>
    </div>
  </div>

<script>
  const TYPE_LABEL = {
    "frontend-component": "프론트엔드 컴포넌트",
    "frontend-feature": "프론트엔드 기능",
    "backend-module": "백엔드 모듈",
    "backend-feature": "백엔드 기능",
  };
  // 트리에 그룹을 보여 주는 순서. 여기 없는 종류는 뒤에 붙는다.
  const TYPE_ORDER = Object.keys(TYPE_LABEL);
  const GRADE_LABEL = { breaking: "수정 필요", behavior: "확인 필요", compatible: "기능 추가", new: "신규", docs: "내부 변경" };
  let assets = [];

  // 커밋 시각(ISO 8601, 시간대 제각각)을 한국 시간 "YYYY-MM-DD HH:mm"으로 보여 준다.
  function formatKst(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const k = new Date(d.getTime() + 9 * 3600 * 1000).toISOString();
    return `${k.slice(0, 10)} ${k.slice(11, 16)}`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  async function loadAssets() {
    document.getElementById("tree").innerHTML = '<div class="empty">불러오는 중...</div>';
    const res = await fetch("/api/assets");
    assets = await res.json();
    renderTree();
  }

  function renderTree() {
    const grouped = {};
    assets.forEach((a) => (grouped[a.type] ??= []).push(a));

    const rank = (t) => (TYPE_ORDER.includes(t) ? TYPE_ORDER.indexOf(t) : TYPE_ORDER.length);
    const html = Object.entries(grouped)
      .sort(([a], [b]) => rank(a) - rank(b))
      .map(([type, items]) => {
        const rows = items
          .map(
            (a) => `
          <li class="asset" data-idx="${assets.indexOf(a)}">
            <span class="dot ${type}"></span>
            <span class="name">${escapeHtml(a.name)}</span>
            <span class="purpose">${escapeHtml(a.purpose)}</span>
          </li>`
          )
          .join("");
        return `
        <div class="group">
          <div class="group-head">${TYPE_LABEL[type] ?? type} <span class="count">${items.length}</span></div>
          <ul class="asset-list">${rows}</ul>
        </div>`;
      })
      .join("");

    document.getElementById("tree").innerHTML = html || '<div class="empty">등록된 자산이 없습니다.</div>';

    document.querySelectorAll(".asset").forEach((el) => {
      el.addEventListener("click", () => selectAsset(Number(el.dataset.idx)));
    });
  }

  function selectAsset(idx) {
    document.querySelectorAll(".asset").forEach((e) => e.classList.remove("active"));
    const el = document.querySelector(`.asset[data-idx="${idx}"]`);
    if (el) {
      el.classList.add("active");
      el.scrollIntoView({ block: "nearest" });
    }
    render(assets[idx]);
  }

  // detail은 "[설명]\n- ...\n[사용 예]\n  코드..." 처럼 섹션으로 나뉜 문자열이다 (common-asset-sync 스킬의 detail 작성 형식).
  // 섹션 머리가 하나도 없으면 예전 형식(문단 하나)으로 보고 null을 돌려준다.
  function parseDetail(text) {
    const sections = [];
    let cur = null;
    for (const line of text.split("\n")) {
      const m = line.match(/^\[(.+?)\]\s*$/);
      if (m) {
        cur = { title: m[1], lines: [] };
        sections.push(cur);
      } else {
        if (!cur) sections.push((cur = { title: null, lines: [] }));
        cur.lines.push(line);
      }
    }
    return sections.some((s) => s.title) ? sections : null;
  }

  // "- a" 로 시작하는 줄은 새 항목, 아닌 줄은 앞 항목에 이어 붙인다.
  function toItems(lines) {
    const items = [];
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (line.startsWith("- ") || !items.length) items.push(line.replace(/^- /, ""));
      else items[items.length - 1] += " " + line;
    }
    return items;
  }

  const SECTION_LABEL = { props: "Props 상세" };

  function renderSection(s) {
    const title = s.title ? SECTION_LABEL[s.title] ?? s.title : "설명";
    let body;
    if (s.title === "사용 예") {
      const code = s.lines.map((l) => l.replace(/^ {2}/, "")).join("\n").replace(/^\n+|\n+$/g, "");
      body = `<div class="code-block">${escapeHtml(code)}</div>`;
    } else if (s.title === "props" || s.title === "메서드") {
      body = `<div class="kv">${toItems(s.lines)
        .map((it) => {
          const i = it.indexOf(": ");
          return i < 0
            ? `<div class="k"></div><div>${escapeHtml(it)}</div>`
            : `<div class="k">${escapeHtml(it.slice(0, i))}</div><div>${escapeHtml(it.slice(i + 2))}</div>`;
        })
        .join("")}</div>`;
    } else {
      body = `<ul>${toItems(s.lines).map((it) => `<li>${escapeHtml(it)}</li>`).join("")}</ul>`;
    }
    return `<div class="doc-sec${s.title === "주의" ? " warn" : ""}"><h3>${escapeHtml(title)}</h3>${body}</div>`;
  }

  function renderDetail(detail) {
    if (!detail) return "";
    const sections = parseDetail(detail);
    const inner = sections
      ? sections.map(renderSection).join("")
      : `<div class="doc-sec"><h3>설명</h3><p>${escapeHtml(detail)}</p></div>`;
    return `<div class="doc">${inner}</div>`;
  }

  function chipList(items) {
    return `<div class="chip-row">${items.map((p) => `<span class="chip">${escapeHtml(p)}</span>`).join("")}</div>`;
  }

  function sigList(items) {
    return `<div class="sig-list">${items.map((p) => `<div class="sig">${escapeHtml(p)}</div>`).join("")}</div>`;
  }

  // 종류별로 보여 줄 필드. 파일 하나짜리는 Props/Usage를 늘 보여 주고(없으면 "없음"),
  // 여러 파일로 된 기능(feature)은 정리집에 있는 필드만 보여 준다 (common-asset-sync 스킬의 필드 추출 규칙).
  function fieldsHtml(a) {
    const fields = [];
    if (a.type === "frontend-component") fields.push(["Props", a.props || [], chipList, true]);
    else if (a.type === "backend-module") fields.push(["Usage", a.usage || [], sigList, true]);
    else {
      fields.push(["Props", a.props || [], chipList, false]);
      fields.push(["Usage", a.usage || [], sigList, false]);
      fields.push(["API", a.api || [], sigList, false]);
      fields.push(["구성 파일", a.files || [], sigList, false]);
    }
    return fields
      .filter(([, items, , always]) => always || items.length)
      .map(([label, items, list]) => `<div class="field">
        <div class="label">${label}</div>
        ${items.length ? list(items) : '<span class="meta">없음</span>'}
      </div>`)
      .join("");
  }

  function render(a) {
    const related =(a.related || []).map((name) => ({ name, idx: assets.findIndex((x) => x.name === name) }));
    const relatedHtml = related.length
      ? `<div class="field">
          <div class="label">함께 쓰는 공통 자산</div>
          <div class="chip-row">${related
            .map((r) => (r.idx >= 0
              ? `<span class="chip link" data-idx="${r.idx}">${escapeHtml(r.name)} →</span>`
              : `<span class="chip">${escapeHtml(r.name)}</span>`))
            .join("")}</div>
        </div>`
      : "";

    const history = (a.history || []).slice().reverse();
    const historyHtml = history.length
      ? `<div class="field">
          <div class="label">변경 이력</div>
          <ul class="history">${history
            .map((h) => `<li>
              <span class="when">${escapeHtml(formatKst(h.at))} · ${escapeHtml(h.commit)}</span>
              <span class="grade ${escapeHtml(h.grade)}">${escapeHtml(GRADE_LABEL[h.grade] ?? h.grade)}</span>
              <span>${escapeHtml(h.summary)}</span>
            </li>`)
            .join("")}</ul>
        </div>`
      : "";

    const updated = a.updatedInCommit
      ? `<div class="meta">수정 ${escapeHtml(a.updatedInCommit)} · ${escapeHtml(a.updatedAt)}</div>`
      : "";

    const detailEl = document.getElementById("detail");
    detailEl.innerHTML = `
      <h1>${escapeHtml(a.name)}</h1>
      <div class="path">${escapeHtml(a.path)}</div>
      <div class="purpose-full">${escapeHtml(a.purpose)}</div>
      ${renderDetail(a.detail)}
      ${fieldsHtml(a)}
      ${relatedHtml}
      ${historyHtml}
      <div class="field">
        <div class="label">커밋</div>
        <div class="meta">추가 ${escapeHtml(a.addedInCommit)} · ${escapeHtml(a.addedAt)}</div>
        ${updated}
      </div>
      <div class="field">
        <div class="label">${a.files ? "소스 코드 (시작 파일)" : "소스 코드"}</div>
        <div class="code-block">${escapeHtml(a.source)}</div>
      </div>
    `;
    detailEl.scrollTop = 0;
    detailEl.querySelectorAll(".chip.link").forEach((chip) => {
      chip.addEventListener("click", () => selectAsset(Number(chip.dataset.idx)));
    });
  }

  document.getElementById("refresh-btn").addEventListener("click", loadAssets);

  const askInput = document.getElementById("ask-input");
  const askBtn = document.getElementById("ask-btn");
  const askAnswer = document.getElementById("ask-answer");

  async function ask() {
    const question = askInput.value.trim();
    if (!question) return;

    askAnswer.hidden = false;
    askAnswer.className = "ask-answer loading";
    askAnswer.innerHTML = `<div class="q">Q. ${escapeHtml(question)}</div>
      <div class="skeleton" role="status" aria-label="검색 중"><span></span><span></span><span></span></div>`;
    askBtn.disabled = true;
    askBtn.innerHTML = '<span class="spinner"></span>검색 중';

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || "알 수 없는 오류");

      const related = (data.relatedAssetNames || [])
        .map((name) => assets.find((a) => a.name.toLowerCase() === name.toLowerCase()))
        .filter(Boolean);

      const chipRow = related.length
        ? `<div class="chip-row" style="margin-top:8px;">${related
            .map((a) => `<span class="chip asset-chip" data-idx="${assets.indexOf(a)}" style="cursor:pointer;">${escapeHtml(a.name)} 보기 →</span>`)
            .join("")}</div>`
        : "";

      askAnswer.className = "ask-answer";
      askAnswer.innerHTML = `<div class="q">Q. ${escapeHtml(question)}</div>${escapeHtml(data.answer)}${chipRow}`;

      askAnswer.querySelectorAll(".asset-chip").forEach((chip) => {
        chip.addEventListener("click", () => selectAsset(Number(chip.dataset.idx)));
      });

      document.querySelectorAll(".asset").forEach((e) => e.classList.remove("active"));
      related.forEach((a) => {
        const el = document.querySelector(`.asset[data-idx="${assets.indexOf(a)}"]`);
        if (el) el.classList.add("active");
      });
      if (related.length > 0) render(related[0]);
    } catch (err) {
      askAnswer.className = "ask-answer error";
      askAnswer.innerHTML = `<div class="q">Q. ${escapeHtml(question)}</div>질문 서버 응답에 문제가 있어요. (${escapeHtml(err.message)})`;
    } finally {
      askBtn.disabled = false;
      askBtn.textContent = "검색";
    }
  }

  askBtn.addEventListener("click", ask);
  askInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") ask();
  });

  loadAssets();
</script>
</body>
</html>
